# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App on Demo - openworx-demo-portal

on:
  push:
    branches:
      - openworx-demo-env
  workflow_dispatch:

jobs:
    build:
      runs-on: windows-latest
      permissions:
        contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install        
        run: |
          npm install --legacy-peer-deps

      - name: Build 
        env:
          CI: false
        run: npm run build --if-present
          
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: build

   deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: build
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_591E9C717BFE432297DC61A417290CFE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4D4784B3E9CB4BC8B5F7879E0BACDEC2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68A33EA6B3054CED94B547C6DD39512A }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'openworx-demo-portal'
          slot-name: 'Production'
          package: build
          
